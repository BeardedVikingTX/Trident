  - id: "proxy-traefik-001"
    name: "Traefik — StripPrefix misconfiguration"
    category: "proxy_specific"
    technique: "strip-prefix"
    server: "traefik"
    payload: "/{{ALLOWED_PATH}}/{{PATH}}"
    description: >
      Traefik StripPrefix bypass — when Traefik strips /api from /api/admin,
      it passes /admin to the backend. If the ACL only checks the rewritten
      path (post-strip), prefix it with a stripped path to reach protected routes.
      Example: /static/../../admin or /api/../admin.
    tags: ["traefik", "strip-prefix", "path-rewrite"]
    risk: "safe"
    severity: "high"
    priority: 2
    scanner_note: "{{ALLOWED_PATH}} = a publicly accessible path prefix (e.g. /api, /static, /public). Try each discovered public prefix."

  - id: "proxy-varnish-001"
    name: "Varnish — PURGE method bypass"
    category: "proxy_specific"
    technique: "verb-swap"
    server: "varnish"
    method: "PURGE"
    description: >
      Varnish PURGE method — some Varnish configurations allow PURGE from
      localhost only, but if accessible externally, it can flush cache entries
      and force cache misses to the origin, bypassing cached 403 responses.
    tags: ["varnish", "purge", "cache"]
    risk: "safe"
    severity: "medium"
    priority: 5

  - id: "proxy-varnish-002"
    name: "Varnish — BAN method"
    category: "proxy_specific"
