  - id: "waf-modsec-001"
    name: "ModSecurity — versioned comment bypass"
    category: "waf_specific"
    technique: "comment"
    waf: "modsecurity"
    payload: "/{{PATH}}/*!50000*/"
    description: >
      MySQL-style versioned comment in the path — ModSecurity rules often
      pattern-match on path structure; injecting /*!50000*/ suffix breaks
      those regex patterns while still reaching the backend route.
    tags: ["modsecurity", "comment", "path-suffix"]
    risk: "safe"
    severity: "medium"
    priority: 5

  - id: "waf-modsec-002"
    name: "ModSecurity — paranoia level detection"
    category: "waf_specific"
    technique: "probe"
    waf: "modsecurity"
    payload: "/{{PATH}}/../{{PATH}}"
    description: >
      Double-path traversal probe — ModSecurity paranoia levels 1–4 block
      progressively more. This combination tests whether level 1/2 rules
      are in place (level 1 may allow this; level 3+ will not).
    tags: ["modsecurity", "paranoia", "traversal"]
    risk: "safe"
    severity: "low"
    priority: 7

  - id: "waf-akamai-001"
    name: "Akamai — Pragma: akamai-x-get-request-id"
    category: "waf_specific"
    technique: "debug-header"
    waf: "akamai"
    header: "Pragma"
    value: "akamai-x-get-request-id"
    description: >
      Akamai debug Pragma header — tells the Akamai edge to include internal
      routing info in the response. Useful for fingerprinting and identifying
      bypass opportunities in the Akamai rule set.
    tags: ["akamai", "debug", "fingerprint", "cdn"]
    risk: "safe"
    severity: "info"
    priority: 6
    cloud_platform: "akamai"

  - id: "waf-generic-001"
    name: "Generic WAF — chunked encoding evasion"
    category: "waf_specific"
    technique: "chunked"
    waf: "generic"
    description: >
      Send the request body in very small Transfer-Encoding: chunked pieces —
      WAFs that reassemble chunks before inspection have a size limit; WAFs
      that inspect each chunk individually see only fragments of the payload.
      Effective against inline WAFs inspecting POST bodies.
    tags: ["chunked", "waf-bypass", "generic", "te"]
    risk: "safe"
    severity: "medium"
    priority: 5
    requires_raw_socket: true

