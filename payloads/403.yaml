      normalize %2F%2E%2E%2F (encoded /../) before ACL checks.
    tags: ["express", "nodejs", "encoding", "path-to-regexp"]
    risk: "safe"
    severity: "medium"
    priority: 4

  - id: "proxy-nginx-003"
    name: "nginx — try_files fallback probe"
    category: "proxy_specific"
    technique: "try-files"
    server: "nginx"
    payload: "/{{PATH}}@"
    description: >
      nginx try_files with @ location bypass — some nginx configs fall back
