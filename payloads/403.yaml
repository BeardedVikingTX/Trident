    tags: ["varnish", "ban", "cache"]
    risk: "safe"
    severity: "medium"
    priority: 6

  - id: "proxy-caddy-001"
    name: "Caddy — path with encoded slash in handle"
    category: "proxy_specific"
    technique: "encoding"
    server: "caddy"
    payload: "/{{PATH}}%2F"
    description: >
      Caddy handle_path vs route bypass — Caddy's route directive matches
      after URL decoding, but handle_path strips the prefix. An encoded
      trailing slash can cause a path to be rewritten incorrectly.
    tags: ["caddy", "encoding", "handle-path"]
    risk: "safe"
    severity: "medium"
    priority: 5

  - id: "proxy-spring-001"
    name: "Spring Boot Actuator — direct access"
    category: "proxy_specific"
    technique: "endpoint-probe"
    server: "spring-boot"
    payload: "/actuator/{{ACTUATOR_ENDPOINT}}"
    description: >
      Spring Boot Actuator endpoints — try /actuator, /actuator/health,
